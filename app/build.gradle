apply plugin: 'com.android.application'

def localKeystorePropertiesFile = rootProject.file("keystore.properties")
def legacyKeystorePropertiesFile =
    rootProject.file("../legacy/capacitor-app/android/keystore.properties")
def keystorePropertiesFile = localKeystorePropertiesFile.exists()
    ? localKeystorePropertiesFile
    : legacyKeystorePropertiesFile
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseStoreValue = keystoreProperties.getProperty("storeFile", "")
def releaseStoreFile = releaseStoreValue.isEmpty()
    ? null
    : new File(releaseStoreValue)
if (releaseStoreFile != null && !releaseStoreFile.isAbsolute()) {
    releaseStoreFile = new File(keystorePropertiesFile.parentFile, releaseStoreValue)
}
def releaseSigningAvailable = keystorePropertiesFile.exists()
    && releaseStoreFile != null
    && releaseStoreFile.isFile()

def githubPropertiesFile = rootProject.file("github.properties")
def githubProperties = new Properties()
if (githubPropertiesFile.exists()) {
    githubProperties.load(new FileInputStream(githubPropertiesFile))
}
// OAuth Client IDs identify an application and are intentionally public.
// Forks can override this value without changing source-controlled files.
def bundledGithubClientId = "Ov23lim5kJlPF7yEFTGm"
def githubClientId = githubProperties.getProperty(
    "clientId",
    providers.gradleProperty("ANDROIDFT_GITHUB_CLIENT_ID")
        .orElse(bundledGithubClientId)
        .get())
def githubClientSecret = githubProperties.getProperty(
    "clientSecret",
    providers.gradleProperty("ANDROIDFT_GITHUB_CLIENT_SECRET")
        .orElse("")
        .get())

android {
    namespace 'ru.drshapaya.androidft2'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.drshapaya.familytree'
        minSdk 24
        targetSdk 36
        versionCode 299
        versionName '2.7.3'
        buildConfigField "String", "GITHUB_CLIENT_ID", "\"${githubClientId.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "String", "GITHUB_CLIENT_SECRET", "\"${githubClientSecret.replace("\\", "\\\\").replace("\"", "\\\"")}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (releaseSigningAvailable) {
        signingConfigs {
            release {
                storeFile releaseStoreFile
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
}
