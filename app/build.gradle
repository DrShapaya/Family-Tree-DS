apply plugin: 'com.android.application'

def localKeystorePropertiesFile = rootProject.file("keystore.properties")
def legacyKeystorePropertiesFile =
    rootProject.file("../legacy/capacitor-app/android/keystore.properties")
def keystorePropertiesFile = localKeystorePropertiesFile.exists()
    ? localKeystorePropertiesFile
    : legacyKeystorePropertiesFile
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseStoreValue = keystoreProperties.getProperty("storeFile", "")
def releaseStoreFile = releaseStoreValue.isEmpty()
    ? null
    : new File(releaseStoreValue)
if (releaseStoreFile != null && !releaseStoreFile.isAbsolute()) {
    releaseStoreFile = new File(keystorePropertiesFile.parentFile, releaseStoreValue)
}
def releaseSigningAvailable = keystorePropertiesFile.exists()
    && releaseStoreFile != null
    && releaseStoreFile.isFile()

def githubPropertiesFile = rootProject.file("github.properties")
def githubProperties = new Properties()
if (githubPropertiesFile.exists()) {
    githubProperties.load(new FileInputStream(githubPropertiesFile))
}
// OAuth Client IDs identify an application and are intentionally public.
// Forks can override this value without changing source-controlled files.
def bundledGithubClientId = "Ov23lim5kJlPF7yEFTGm"
def githubClientId = githubProperties.getProperty(
    "clientId",
    providers.gradleProperty("ANDROIDFT_GITHUB_CLIENT_ID")
        .orElse(bundledGithubClientId)
        .get())
def githubClientSecret = githubProperties.getProperty(
    "clientSecret",
    providers.gradleProperty("ANDROIDFT_GITHUB_CLIENT_SECRET")
        .orElse("")
        .get())
def appMetricaPropertiesFile = rootProject.file("appmetrica.properties")
def appMetricaProperties = new Properties()
if (appMetricaPropertiesFile.exists()) {
    appMetricaProperties.load(new FileInputStream(appMetricaPropertiesFile))
}
def appMetricaApiKey = appMetricaProperties.getProperty(
    "apiKey",
    providers.gradleProperty("APPMETRICA_API_KEY")
        .orElse("")
        .get())

android {
    namespace 'ru.drshapaya.androidft2'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.drshapaya.familytree'
        minSdk 24
        targetSdk 36
        versionCode 302
        versionName '2.8.0'
        manifestPlaceholders = [appLabel: "Family Tree DS"]
        buildConfigField "String", "GITHUB_CLIENT_ID", "\"${githubClientId.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "String", "GITHUB_CLIENT_SECRET", "\"${githubClientSecret.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "String", "APPMETRICA_API_KEY", "\"${appMetricaApiKey.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "String", "YANDEX_REWARDED_AD_UNIT_ID", "\"demo-rewarded-yandex\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (releaseSigningAvailable) {
        signingConfigs {
            release {
                storeFile releaseStoreFile
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders = [appLabel: "Family Tree DS Debug"]
        }

        release {
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
            buildConfigField "String", "YANDEX_REWARDED_AD_UNIT_ID", "\"R-M-19993209-1\""
            minifyEnabled false
            shrinkResources false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    // The app has an in-app language switch. Widget strings for both supported
    // languages must remain available even when Play installs an App Bundle.
    bundle {
        language {
            enableSplit = false
        }
    }
}

dependencies {
    implementation 'com.yandex.android:mobileads:8.4.0'
    implementation 'io.appmetrica.analytics:analytics:8.5.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
    // Device rendering checks use the platform test runner, without app runtime dependencies.
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/${android.compileSdkVersion}/optional/android.test.base.jar")
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/${android.compileSdkVersion}/optional/android.test.runner.jar")
}
