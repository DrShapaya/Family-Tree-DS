function fit(list=data.people){if(!list.length){redraw();return;}let x=Infinity,y=Infinity,r=-Infinity,b=-Infinity;for(const p of list){x=Math.min(x,p.x);y=Math.min(y,p.y);r=Math.max(r,p.x+W);b=Math.max(b,p.y+H);}zoom=Math.max(.0001,Math.min(1.15,(cw-64)/(r-x),(ch-170)/(b-y)));tx=(cw-(r-x)*zoom)/2-x*zoom;ty=85+(ch-170-(b-y)*zoom)/2-y*zoom;redraw();}
function center(p){zoom=Math.max(.8,Math.min(1.15,zoom));if(cw<400)zoom=Math.min(zoom,(cw-50)/W);tx=cw/2-(p.x+W/2)*zoom;ty=ch/2-(p.y+H/2)*zoom;redraw();}
function choose(id,move=true,open=true,remember=true){const p=people.get(id);if(!p)return;if(remember&&selected&&selected!==id)history.push(selected);selected=id;$('back').disabled=!history.length;$('location').textContent=p.name;if(move)center(p);const box=$('details');box.replaceChildren();if(p.photo){const im=add(box,'img');im.src=p.photo;im.alt=p.name;im.className='portrait';}else add(box,'div',initials(p.name),'portrait initials');add(box,'h2',p.name);const actions=add(box,'div',undefined,'person-actions');add(actions,'button',t.center,'primary').onclick=()=>{center(p);closePanel();};add(actions,'button',t.near).onclick=()=>{fit([p,...new Set(relatives.get(id).map(r=>people.get(r[0])))]);closePanel();};for(const [label,value] of [[t.born,p.born],[t.died,p.died],[t.place,p.place]])if(value){const f=add(box,'div',undefined,'fact');add(f,'small',label);add(f,'span',value);}if(relatives.get(id).length){add(box,'h3',t.family);const seen=new Set();for(const [other,type] of relatives.get(id)){const key=other+type;if(seen.has(key))continue;seen.add(key);const person=people.get(other),btn=add(box,'button',undefined,'relative');add(btn,'span',initials(person.name),'initials');const label=add(btn,'span',undefined,'row-text');add(label,'small',t[type]||type);add(label,'span',person.name);add(btn,'span','›','chevron');btn.onclick=()=>choose(other);}}if(p.notes){add(box,'h3',t.notes);add(box,'p',p.notes);}if((p.memories||[]).length){add(box,'h3',t.memories);for(const m of p.memories){add(box,'strong',m.title);add(box,'p',m.text);}}tab('person',open);box.parentElement.scrollTop=0;redraw();}
const sorted=[...data.people].sort((a,b)=>a.name.localeCompare(b.name,en?'en':'ru'));
function search(){const terms=$('search').value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);const matches=sorted.filter(p=>terms.every(q=>searchText.get(p.id).includes(q)));$('results').replaceChildren();$('result-count').textContent=matches.length+' / '+data.people.length+' '+t.count;for(const p of matches.slice(0,resultLimit)){const b=add($('results'),'button',undefined,p.id===selected?'active':'');add(b,'span',initials(p.name),'initials');const text=add(b,'span',undefined,'row-text');add(text,'span',p.name);add(text,'small',[p.born,p.died].filter(Boolean).join(' — ')||p.place);add(b,'span','›','chevron');b.onclick=()=>choose(p.id);}if(!matches.length)add($('results'),'p',t.empty,'empty');if(matches.length>resultLimit)add($('results'),'button',t.more).onclick=()=>{resultLimit+=80;search();};}
function scale(f,x=cw/2,y=ch/2){const next=Math.max(.0001,Math.min(3,zoom*f));tx=x-(x-tx)*next/zoom;ty=y-(y-ty)*next/zoom;zoom=next;redraw();}
canvas.addEventListener('wheel',e=>{e.preventDefault();const b=canvas.getBoundingClientRect();scale(Math.exp(-Math.max(-200,Math.min(200,e.deltaY))*.003),e.clientX-b.left,e.clientY-b.top);},{passive:false});
const pointers=new Map();let gesture=null,clickStart=null,moved=false;
function gestureState(){const a=[...pointers.values()];return a.length>1?{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}:a.length?{...a[0],d:0}:null;}
canvas.onpointerdown=e=>{if(e.button!==0)return;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});gesture=gestureState();if(pointers.size===1){clickStart={x:e.clientX,y:e.clientY};moved=false;}else moved=true;canvas.classList.add('dragging');};
canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const next=gestureState();if(clickStart&&Math.hypot(e.clientX-clickStart.x,e.clientY-clickStart.y)>5)moved=true;if(gesture){tx+=next.x-gesture.x;ty+=next.y-gesture.y;if(next.d>0&&gesture.d>0){const b=canvas.getBoundingClientRect();scale(next.d/gesture.d,next.x-b.left,next.y-b.top);}redraw();}gesture=next;};
function release(e,cancel){if(!pointers.has(e.pointerId))return;const click=!cancel&&!moved&&pointers.size===1;pointers.delete(e.pointerId);gesture=gestureState();if(!pointers.size)canvas.classList.remove('dragging');if(click){const b=canvas.getBoundingClientRect(),x=(e.clientX-b.left-tx)/zoom,y=(e.clientY-b.top-ty)/zoom;const p=[...data.people].reverse().find(p=>x>=p.x&&x<=p.x+W&&y>=p.y&&y<=p.y+H);if(p)choose(p.id,false);}if(cancel)moved=true;}
canvas.onpointerup=e=>release(e,false);canvas.onpointercancel=e=>release(e,true);canvas.onlostpointercapture=e=>release(e,true);
$('in').onclick=()=>scale(1.4);$('out').onclick=()=>scale(1/1.4);$('fit').onclick=()=>{fit();$('location').textContent=t.all;};$('root').onclick=()=>choose(people.has(data.root)?data.root:data.people[0]?.id,true,false);$('back').onclick=()=>{const id=history.pop();if(id)choose(id,true,false,false);};$('search').oninput=()=>{resultLimit=80;search();};$('tab-people').onclick=()=>{tab('people');search();};$('tab-person').onclick=()=>tab('person');$('mobile-people').onclick=()=>{tab('people');search();$('search').focus();};$('panel-close').onclick=closePanel;
function help(open){$('help').hidden=!open;$('help-toggle').setAttribute('aria-expanded',open);} $('help-toggle').onclick=()=>help($('help').hidden);$('help-close').onclick=()=>help(false);
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();help(false);return;}if(e.target.matches('input,textarea'))return;if(e.key==='/'){e.preventDefault();tab('people');$('search').focus();}if(e.target===canvas){if(e.key==='+'||e.key==='=')scale(1.3);if(e.key==='-')scale(1/1.3);if(e.key==='Home')fit();const offsets={ArrowLeft:[70,0],ArrowRight:[-70,0],ArrowUp:[0,70],ArrowDown:[0,-70]};if(offsets[e.key]){e.preventDefault();tx+=offsets[e.key][0];ty+=offsets[e.key][1];redraw();}}});
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),oldW=cw,oldH=ch;cw=r.width;ch=r.height;canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);tx+=(cw-oldW)/2;ty+=(ch-oldH)/2;redraw();}new ResizeObserver(resize).observe(canvas);resize();search();if(data.people.length)choose(people.has(data.root)?data.root:data.people[0].id,true,false);else{add($('details'),'p',t.choose);$('location').textContent=t.title;redraw();}
</script></body></html>
